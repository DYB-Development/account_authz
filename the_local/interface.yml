scope: authorization — capability catalog, roles, and Pundit enforcement in multi-tenant Rails apps

install:
  - gem "citizen"
  - bin/rails citizen:install:migrations
  - Citizen::Member
  - Citizen::Authorization
  - Citizen::Current.account_id
  - mount Citizen::Engine

develop:
  - Citizen.catalog
  - Citizen.catalog.permissions
  - Citizen.catalog.metrics
  - Citizen.capabilities
  - Citizen.reset!
  - Citizen.can?
  - Citizen.approved_metrics
  - Citizen::Role.in_account
  - Citizen::Role.create!
  - Citizen::Role.from_template
  - Citizen.templates
  - Citizen.templates.find
  - Citizen.templates.defaults
  - Citizen.seed_default_roles
  - member.assign_role
  - member.revoke_role
  - member.citizen_roles
  - member.capabilities
  - member.can?
  - member.approved_metrics
  - Citizen::ApplicationPolicy
  - Citizen.members_source
  - Citizen.members_capability
  - Citizen.roles_capability
  - Citizen::Reach
  - reach.includes_member?
  - reach.includes_role?

sources:
  - lib/citizen.rb
  - lib/citizen/catalog.rb
  - lib/citizen/templates.rb
  - lib/citizen/engine.rb
  - config/routes.rb
  - app/controllers/citizen/members_controller.rb
  - app/controllers/citizen/member_roles_controller.rb
  - app/views/citizen/members/index.html.erb
  - app/controllers/citizen/roles_controller.rb
  - app/models/citizen/reach.rb
  - app/views/citizen/roles/index.html.erb
  - app/views/citizen/roles/_form.html.erb
  - app/controllers/citizen/application_controller.rb
  - app/helpers/citizen/app_routes_helper.rb
  - lib/citizen/reference/guide.md
  - app/models/citizen/role.rb
  - app/models/citizen/current.rb
  - app/models/concerns/citizen/member.rb
  - app/controllers/concerns/citizen/authorization.rb
  - app/policies/citizen/application_policy.rb
